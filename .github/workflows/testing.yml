name: PHPUnit Test

on:
  push:
    branches:
      - "**"

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
        php: [8.4.2]
    runs-on: ${{ matrix.os }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      minio:
        image: minio/minio:edge-cicd
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: admin
          MINIO_ROOT_PASSWORD: password
        options: >-
          --health-cmd="curl http://localhost:9000/minio/health/live"
          --health-interval=250ms
          --health-timeout=0s
          --health-retries=30

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_HOST: 127.0.0.1
      DB_DATABASE: ":memory:"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      FILESYSTEM_DISK: s3
      MINIO_USER: admin
      MINIO_PASSWORD: password
      MINIO_BUCKET: uploads
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_REGION: ap-northeast-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, exif, pcntl, bcmath, oci8
          coverage: pcov

      # https://github.com/actions/cache/blob/main/examples.md#php---composer
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # https://github.com/actions/cache/blob/main/examples.md#node---npm
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v4
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-suggest --optimize-autoloader

      - name: Dump Autoload
        run: composer dump-autoload

      - name: Generate key
        run: php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate

      - name: Install Assets
        run: npm install

      - name: Build Assets
        run: npm run build

      - name: Setup MinIO default bucket
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set myminio http://127.0.0.1:9000 admin password
          ./mc mb --ignore-existing myminio/uploads

      - name: Run tests
        run: ./vendor/bin/phpunit --coverage-text --colors=auto --display-incomplete

name: Pokemon LGTM

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

jobs:
  pokemon-lgtm:
    runs-on: ubuntu-latest
    # approve時のコメントに「draw poke」を含む場合のみ実行
    if: >-
      github.event.review.state == 'approved' &&
      contains(github.event.review.body, 'draw poke')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            const maxId = 1025;
            const randomId = Math.floor(Math.random() * maxId) + 1;

            // ポケモン基本情報を取得
            const pokemonRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${randomId}`);
            if (!pokemonRes.ok) {
              core.setFailed(`Failed to fetch Pokemon: ${pokemonRes.status}`);
              return;
            }
            const pokemon = await pokemonRes.json();

            // 日本語名を取得するためspeciesエンドポイントを呼ぶ
            const speciesRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${randomId}`);
            let japaneseName = pokemon.name;
            if (speciesRes.ok) {
              const species = await speciesRes.json();
              const jpName = species.names.find(n => n.language.name === 'ja');
              if (jpName) japaneseName = jpName.name;
            }

            const spriteUrl = pokemon.sprites.other['official-artwork'].front_default
              || pokemon.sprites.front_default;

            // タイプの日本語マッピング
            const typeMap = {
              normal: 'ノーマル', fire: 'ほのお', water: 'みず', electric: 'でんき',
              grass: 'くさ', ice: 'こおり', fighting: 'かくとう', poison: 'どく',
              ground: 'じめん', flying: 'ひこう', psychic: 'エスパー', bug: 'むし',
              rock: 'いわ', ghost: 'ゴースト', dragon: 'ドラゴン', dark: 'あく',
              steel: 'はがね', fairy: 'フェアリー'
            };
            const types = pokemon.types.map(t => typeMap[t.type.name] || t.type.name).join(', ');

            const commentBody = [
              `<img src="${spriteUrl}" alt="${japaneseName}" width="300">`,
              '',
              `やせいの　${japaneseName}が　あらわれた！`,
              `${japaneseName}の　LGTM！`,
              '',
              `図鑑No: ${pokemon.id}`,
              `タイプ: ${types}`,
            ].join('\n');

            const prNumber = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${japaneseName} (#${pokemon.id}) to PR #${prNumber}`);

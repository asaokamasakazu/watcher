name: Pokemon TCG LGTM

on:
  issue_comment:
    types: [created]

jobs:
  pokemon-tcg-lgtm:
    runs-on: ubuntu-latest
    # PRコメントに「draw pokeca」を含む場合のみ実行
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'draw pokeca')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon TCG Card and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            // TCGdex API（日本語版を使用、直近のシリーズに限定）
            const JA_URL = 'https://api.tcgdex.net/v2/ja';

            // 対象シリーズ（Sword & Shield + Scarlet & Violet）
            const TARGET_SERIES = ['s', 'sv'];

            // fetch（404はnullを返す）
            async function fetchJson(url) {
              try {
                const res = await fetch(url);
                if (res.ok) return await res.json();
                return null;
              } catch (e) {
                return null;
              }
            }

            // 1. 対象シリーズのセット一覧を取得
            core.info('Fetching series...');
            let allSets = [];
            for (const seriesId of TARGET_SERIES) {
              const series = await fetchJson(`${JA_URL}/series/${seriesId}`);
              if (series?.sets) {
                allSets = allSets.concat(series.sets);
                core.info(`${seriesId}: ${series.sets.length} sets`);
              }
            }

            if (allSets.length === 0) {
              throw new Error('Failed to fetch sets');
            }
            core.info(`Total sets: ${allSets.length}`);

            // 2. 画像付きカードが見つかるまでリトライ
            let card = null;
            let setInfo = null;
            for (let attempt = 0; attempt < 30; attempt++) {
              const randomSet = allSets[Math.floor(Math.random() * allSets.length)];
              core.info(`Attempt ${attempt + 1}: ${randomSet.name}...`);

              const setDetail = await fetchJson(`${JA_URL}/sets/${randomSet.id}`);
              if (!setDetail?.cards?.length) continue;

              const randomCardInfo = setDetail.cards[Math.floor(Math.random() * setDetail.cards.length)];
              const fetchedCard = await fetchJson(`${JA_URL}/cards/${randomCardInfo.id}`);
              if (!fetchedCard?.image) continue;

              card = fetchedCard;
              setInfo = setDetail;
              core.info(`Found: ${card.name}`);
              break;
            }

            if (!card) {
              throw new Error('Failed to find a card with image');
            }

            const cardName = card.name;
            const cardImage = `${card.image}/high.webp`;
            const setName = card.set?.name || '不明';
            const dexId = card.dexId ? `No.${card.dexId}` : '-';
            const releaseDate = setInfo?.releaseDate || '-';

            const commentBody = [
              `<img src="${cardImage}" alt="${cardName}" width="300">`,
              '',
              `**${cardName}** を　ドローした！`,
              '',
              `| 項目 | 値 |`,
              `|------|-----|`,
              `| カード名 | ${cardName} |`,
              `| 全国図鑑番号 | ${dexId} |`,
              `| パック名 | ${setName} |`,
              `| 発売日 | ${releaseDate} |`,
            ].join('\n');

            const prNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${cardName} from ${setName} to PR #${prNumber}`);

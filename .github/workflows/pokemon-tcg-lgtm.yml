name: Pokemon TCG LGTM

on:
  issue_comment:
    types: [created]

jobs:
  pokemon-tcg-lgtm:
    runs-on: ubuntu-latest
    # PRコメントに「draw pokeca」を含む場合のみ実行
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'draw pokeca')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon TCG Card and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            // TCGdex API（英語版でカード検索、日本語版で表示）
            const EN_URL = 'https://api.tcgdex.net/v2/en';
            const JA_URL = 'https://api.tcgdex.net/v2/ja';

            // fetch（404はnullを返す）
            async function fetchJson(url) {
              try {
                const res = await fetch(url);
                if (res.ok) return await res.json();
                return null;
              } catch (e) {
                return null;
              }
            }

            // 1. 英語版でセット一覧を取得（データが豊富）
            core.info('Fetching sets...');
            const sets = await fetchJson(`${EN_URL}/sets`);
            if (!sets) throw new Error('Failed to fetch sets');

            // 2. 画像付きカードが見つかるまでリトライ
            let enCard = null;
            let jaCard = null;
            for (let attempt = 0; attempt < 30; attempt++) {
              const randomSet = sets[Math.floor(Math.random() * sets.length)];
              core.info(`Attempt ${attempt + 1}: ${randomSet.name}...`);

              const setDetail = await fetchJson(`${EN_URL}/sets/${randomSet.id}`);
              if (!setDetail?.cards?.length) continue;

              const randomCardInfo = setDetail.cards[Math.floor(Math.random() * setDetail.cards.length)];
              const fetchedCard = await fetchJson(`${EN_URL}/cards/${randomCardInfo.id}`);
              if (!fetchedCard?.image) continue;

              // 日本語版を取得
              const jaFetched = await fetchJson(`${JA_URL}/cards/${randomCardInfo.id}`);

              enCard = fetchedCard;
              jaCard = jaFetched;
              core.info(`Found: ${fetchedCard.name} (JA: ${jaFetched?.name || 'N/A'})`);
              break;
            }

            if (!enCard) {
              throw new Error('Failed to find a card with image');
            }

            // 日本語版があれば日本語、なければ英語
            const cardName = jaCard?.name || enCard.name;
            const cardImage = `${enCard.image}/high.webp`;
            const setName = jaCard?.set?.name || enCard.set?.name || '不明';
            const rarity = jaCard?.rarity || enCard.rarity || '不明';
            const cardNumber = enCard.localId || '';
            const artist = enCard.illustrator || '不明';

            const commentBody = [
              `<img src="${cardImage}" alt="${cardName}" width="300">`,
              '',
              `**${cardName}** を　ドローした！`,
              '',
              `| 項目 | 値 |`,
              `|------|-----|`,
              `| カード名 | ${cardName} |`,
              `| セット | ${setName} |`,
              `| レアリティ | ${rarity} |`,
              `| カード番号 | ${cardNumber} |`,
              `| イラストレーター | ${artist} |`,
            ].join('\n');

            const prNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${cardName} from ${setName} to PR #${prNumber}`);

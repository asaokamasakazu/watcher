name: Pokemon TCG LGTM

on:
  issue_comment:
    types: [created]

jobs:
  pokemon-tcg-lgtm:
    runs-on: ubuntu-latest
    # PRコメントに「draw pokeca」を含む場合のみ実行
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'draw pokeca')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon TCG Card and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            // 人気セットのリスト（レスポンスサイズを小さくするため）
            const SETS = [
              'base1', 'base2', 'base3', 'base4', 'base5', 'base6',
              'gym1', 'gym2', 'neo1', 'neo2', 'neo3', 'neo4',
              'xy1', 'xy2', 'xy3', 'xy4', 'xy5', 'xy6', 'xy7',
              'sm1', 'sm2', 'sm3', 'sm4', 'sm5', 'sm6', 'sm7', 'sm8', 'sm9', 'sm10', 'sm11', 'sm12',
              'swsh1', 'swsh2', 'swsh3', 'swsh4', 'swsh5', 'swsh6', 'swsh7', 'swsh8', 'swsh9', 'swsh10', 'swsh11', 'swsh12',
              'sv1', 'sv2', 'sv3', 'sv4', 'sv5', 'sv6'
            ];

            // リトライ付きでランダムカードを取得
            async function fetchRandomCard(maxRetries = 10) {
              for (let i = 0; i < maxRetries; i++) {
                try {
                  const randomSet = SETS[Math.floor(Math.random() * SETS.length)];
                  const url = `https://api.pokemontcg.io/v2/cards?q=set.id:${randomSet}&pageSize=50`;
                  core.info(`Attempt ${i + 1}: Fetching from set ${randomSet}...`);

                  const res = await fetch(url);
                  if (!res.ok) {
                    core.info(`HTTP ${res.status}, retrying in 3s...`);
                    await new Promise(r => setTimeout(r, 3000));
                    continue;
                  }

                  const data = await res.json();
                  if (data.data && data.data.length > 0) {
                    const randomIndex = Math.floor(Math.random() * data.data.length);
                    return data.data[randomIndex];
                  }
                } catch (e) {
                  core.info(`Error: ${e.message}, retrying in 3s...`);
                  await new Promise(r => setTimeout(r, 3000));
                }
              }
              throw new Error('Failed to fetch card after max retries');
            }

            const card = await fetchRandomCard();
            const cardName = card.name;
            const cardImage = card.images.large || card.images.small;
            const setName = card.set?.name || '不明';
            const seriesName = card.set?.series || '';
            const rarity = card.rarity || '不明';
            const cardNumber = card.number || '';
            const artist = card.artist || '不明';

            const commentBody = [
              `<img src="${cardImage}" alt="${cardName}" width="300">`,
              '',
              `**${cardName}** を　ドローした！`,
              '',
              `| 項目 | 値 |`,
              `|------|-----|`,
              `| カード名 | ${cardName} |`,
              `| シリーズ | ${seriesName} |`,
              `| セット | ${setName} |`,
              `| レアリティ | ${rarity} |`,
              `| カード番号 | ${cardNumber} |`,
              `| イラストレーター | ${artist} |`,
            ].join('\n');

            const prNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${cardName} from ${setName} to PR #${prNumber}`);

name: Pokemon TCG LGTM

on:
  issue_comment:
    types: [created]

jobs:
  pokemon-tcg-lgtm:
    runs-on: ubuntu-latest
    # PRコメントに「draw pokeca」を含む場合のみ実行
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'draw pokeca')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon TCG Card and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            // TCGdex API を使用（日本語版）
            const BASE_URL = 'https://api.tcgdex.net/v2/ja';

            // リトライ付きfetch
            async function fetchWithRetry(url, maxRetries = 3) {
              for (let i = 0; i < maxRetries; i++) {
                try {
                  const res = await fetch(url);
                  if (res.ok) return await res.json();
                  core.info(`HTTP ${res.status}, retrying...`);
                } catch (e) {
                  core.info(`Error: ${e.message}, retrying...`);
                }
                await new Promise(r => setTimeout(r, 2000));
              }
              throw new Error(`Failed to fetch: ${url}`);
            }

            // 1. セット一覧を取得
            core.info('Fetching sets...');
            const sets = await fetchWithRetry(`${BASE_URL}/sets`);
            const randomSet = sets[Math.floor(Math.random() * sets.length)];
            core.info(`Selected set: ${randomSet.name}`);

            // 2. セット詳細（カード一覧含む）を取得
            const setDetail = await fetchWithRetry(`${BASE_URL}/sets/${randomSet.id}`);
            if (!setDetail.cards || setDetail.cards.length === 0) {
              throw new Error('No cards in set');
            }
            const randomCardInfo = setDetail.cards[Math.floor(Math.random() * setDetail.cards.length)];

            // 3. カード詳細を取得
            core.info(`Fetching card: ${randomCardInfo.id}`);
            const card = await fetchWithRetry(`${BASE_URL}/cards/${randomCardInfo.id}`);

            const cardName = card.name;
            const cardImage = card.image ? `${card.image}/high.webp` : '';
            const setName = card.set?.name || randomSet.name || '不明';
            const rarity = card.rarity || '不明';
            const cardNumber = card.localId || '';
            const artist = card.illustrator || '不明';

            const commentBody = [
              `<img src="${cardImage}" alt="${cardName}" width="300">`,
              '',
              `**${cardName}** を　ドローした！`,
              '',
              `| 項目 | 値 |`,
              `|------|-----|`,
              `| カード名 | ${cardName} |`,
              `| セット | ${setName} |`,
              `| レアリティ | ${rarity} |`,
              `| カード番号 | ${cardNumber} |`,
              `| イラストレーター | ${artist} |`,
            ].join('\n');

            const prNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${cardName} from ${setName} to PR #${prNumber}`);

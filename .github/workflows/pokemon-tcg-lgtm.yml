name: Pokemon TCG LGTM

on:
  issue_comment:
    types: [created]

jobs:
  pokemon-tcg-lgtm:
    runs-on: ubuntu-latest
    # PRコメントに「draw pokeca」を含む場合のみ実行
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'draw pokeca')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon TCG Card and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            // リトライ付きfetch
            async function fetchWithRetry(url, retries = 3) {
              for (let i = 0; i < retries; i++) {
                try {
                  const res = await fetch(url);
                  if (res.ok) return res;
                  if (res.status !== 504 && res.status !== 503) {
                    throw new Error(`HTTP ${res.status}`);
                  }
                  core.info(`Retry ${i + 1}/${retries} after ${res.status}...`);
                } catch (e) {
                  if (i === retries - 1) throw e;
                  core.info(`Retry ${i + 1}/${retries} after error...`);
                }
                await new Promise(r => setTimeout(r, 2000));
              }
              throw new Error('Max retries exceeded');
            }

            // 総カード数は約19000枚（APIコール削減のため固定値を使用）
            const totalCount = 19000;
            const randomPage = Math.floor(Math.random() * totalCount) + 1;

            // ランダムなカードを取得
            const cardRes = await fetchWithRetry(`https://api.pokemontcg.io/v2/cards?page=${randomPage}&pageSize=1`);
            const cardData = await cardRes.json();

            if (!cardData.data || cardData.data.length === 0) {
              core.setFailed('No card data returned');
              return;
            }

            const card = cardData.data[0];
            const cardName = card.name;
            const cardImage = card.images.large || card.images.small;
            const setName = card.set?.name || '不明';
            const seriesName = card.set?.series || '';
            const rarity = card.rarity || '不明';
            const cardNumber = card.number || '';
            const artist = card.artist || '不明';

            const commentBody = [
              `<img src="${cardImage}" alt="${cardName}" width="300">`,
              '',
              `**${cardName}** を　ドローした！`,
              '',
              `| 項目 | 値 |`,
              `|------|-----|`,
              `| カード名 | ${cardName} |`,
              `| シリーズ | ${seriesName} |`,
              `| セット | ${setName} |`,
              `| レアリティ | ${rarity} |`,
              `| カード番号 | ${cardNumber} |`,
              `| イラストレーター | ${artist} |`,
            ].join('\n');

            const prNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${cardName} from ${setName} to PR #${prNumber}`);

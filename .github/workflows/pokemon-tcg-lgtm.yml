name: Pokemon TCG LGTM

on:
  issue_comment:
    types: [created]

jobs:
  pokemon-tcg-lgtm:
    runs-on: ubuntu-latest
    # PRコメントに「draw pokeca」を含む場合のみ実行
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'draw pokeca')

    permissions:
      pull-requests: write

    steps:
      - name: Fetch Random Pokemon TCG Card and Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            // リトライ付きでランダムカードを取得
            async function fetchRandomCard(maxRetries = 5) {
              for (let i = 0; i < maxRetries; i++) {
                try {
                  // pageSize=250でランダムなページを取得（総ページ数は約76）
                  const randomPage = Math.floor(Math.random() * 76) + 1;
                  const url = `https://api.pokemontcg.io/v2/cards?page=${randomPage}&pageSize=250`;
                  core.info(`Fetching page ${randomPage}...`);

                  const res = await fetch(url);
                  if (!res.ok) {
                    core.info(`Retry ${i + 1}/${maxRetries}: HTTP ${res.status}`);
                    await new Promise(r => setTimeout(r, 2000));
                    continue;
                  }

                  const data = await res.json();
                  if (data.data && data.data.length > 0) {
                    // ページ内からランダムに1枚選ぶ
                    const randomIndex = Math.floor(Math.random() * data.data.length);
                    return data.data[randomIndex];
                  }
                } catch (e) {
                  core.info(`Retry ${i + 1}/${maxRetries}: ${e.message}`);
                  await new Promise(r => setTimeout(r, 2000));
                }
              }
              throw new Error('Failed to fetch card after max retries');
            }

            const card = await fetchRandomCard();
            const cardName = card.name;
            const cardImage = card.images.large || card.images.small;
            const setName = card.set?.name || '不明';
            const seriesName = card.set?.series || '';
            const rarity = card.rarity || '不明';
            const cardNumber = card.number || '';
            const artist = card.artist || '不明';

            const commentBody = [
              `<img src="${cardImage}" alt="${cardName}" width="300">`,
              '',
              `**${cardName}** を　ドローした！`,
              '',
              `| 項目 | 値 |`,
              `|------|-----|`,
              `| カード名 | ${cardName} |`,
              `| シリーズ | ${seriesName} |`,
              `| セット | ${setName} |`,
              `| レアリティ | ${rarity} |`,
              `| カード番号 | ${cardNumber} |`,
              `| イラストレーター | ${artist} |`,
            ].join('\n');

            const prNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            core.info(`Posted ${cardName} from ${setName} to PR #${prNumber}`);
